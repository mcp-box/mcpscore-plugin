name: CI

on:
  # Every branch, so a branch pushed without an open PR is still checked.
  push:
    branches: ['**']
  pull_request:
    branches: [main]

concurrency:
  # Event and head repo keep a push run and its PR run (or two forks' branches) from cancelling each other.
  group: >-
    ${{ github.workflow }}-${{ github.event_name }}-${{
    github.event.pull_request.head.repo.full_name || github.repository }}-${{
    github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          python-version: "3.13"
      - run: uv sync --all-groups
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pyright
      - run: uv run pytest -q
      - name: Check manifests, skill, evals and changelog agree
        run: make check
      - name: Audit workflows with zizmor (pinned in the Makefile)
        run: make workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Validate the marketplace and the plugin (Claude Code pinned in the Makefile)
        run: make validate

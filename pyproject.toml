[project]
name = "mcpscore-plugin"
version = "0.1.0"
description = "Checks and tests for the mcpscore coding-agent plugin"
requires-python = ">=3.11"

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "ruff>=0.15.20",
    "types-pyyaml>=6.0.12",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "F", "E", "W", "I", "UP", "B", "C4", "SIM", "PTH", "RET", "TC",
    "ANN001", "ANN002", "ANN003", "S", "T20", "RUF",
]
ignore = [
    "S101",  # asserts are fine in tests
    "COM812",
]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["T201"]
"tests/*.py" = ["S603", "ANN001", "ANN002", "ANN003"]

[tool.pyright]
include = ["scripts", "tests"]
extraPaths = ["scripts"]
pythonVersion = "3.11"
reportMissingImports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts", "."]
addopts = ["--strict-config", "--strict-markers", "-m", "not live"]
markers = ["live: audits a live server with the published mcpscore CLI (network)"]
filterwarnings = ["error"]
